<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>京都市スマイルママ・ホッと事業費用シミュレーター</title>
    <style>
        :root { --main-color: #d81b60; --bg-color: #fff5f8; }
        body { font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; background-color: var(--bg-color); color: #333; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; max-width: 480px; width: 100%; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { font-size: 1.2rem; color: var(--main-color); text-align: center; margin-bottom: 20px; border-bottom: 2px solid var(--bg-color); padding-bottom: 10px; line-height: 1.4; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 0.85rem; color: #555; }
        select, input[type="date"], input[type="number"] { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
        .checkbox-area { background: #fdf0f4; padding: 10px; border-radius: 8px; margin-top: 15px; }
        .checkbox-group { display: flex; align-items: center; cursor: pointer; margin: 5px 0; font-size: 0.9rem; }
        .checkbox-group input { width: auto; margin-right: 10px; }
        .result-box { margin-top: 20px; padding: 20px; background: #fff; border: 2px solid var(--main-color); border-radius: 10px; text-align: center; }
        .total-label { font-size: 0.9rem; color: #666; }
        .total-amount { font-size: 2.2rem; font-weight: bold; color: var(--main-color); margin: 5px 0; }
        .breakdown { font-size: 0.8rem; color: #666; line-height: 1.6; text-align: left; margin-top: 10px; border-top: 1px solid #eee; pt: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>京都市スマイルママ・ホッと事業<br>費用シミュレーター</h1>

    <div class="input-group">
        <label>世帯区分</label>
        <select id="div" onchange="calc()">
            <option value="A">区分A (所得730万〜)</option>
            <option value="B" selected>区分B (課税世帯)</option>
            <option value="C1">区分C1 (非課税世帯)</option>
            <option value="C2">区分C2 (生活保護世帯)</option>
        </select>
    </div>

    <div style="display: flex; gap: 10px;">
        <div style="flex: 1;">
            <label>チェックイン</label>
            <input type="date" id="checkin" onchange="calc()">
        </div>
        <div style="flex: 1;">
            <label>チェックアウト</label>
            <input type="date" id="checkout" onchange="calc()">
        </div>
    </div>

    <div class="checkbox-area">
        <label class="checkbox-group">
            <input type="checkbox" id="multi" onchange="calc()">
            多胎児（双子など）で利用 (+2,000円/日)
        </label>
        <label class="checkbox-group">
            <input type="checkbox" id="holiday_manual" onchange="calc()">
            滞在中に祝日・祝前日が含まれる
        </label>
    </div>

    <div class="result-box">
        <div class="total-label">お支払い概算合計</div>
        <div class="total-amount" id="total">0 円</div>
        <div id="days_display" style="font-size: 0.9rem; color: #d81b60; font-weight: bold;">日付を選択してください</div>
        <div class="breakdown" id="details"></div>
    </div>
</div>

<script>
// 本日をデフォルト値にセット
document.getElementById('checkin').valueAsDate = new Date();

function calc() {
    const div = document.getElementById('div').value;
    const checkin = new Date(document.getElementById('checkin').value);
    const checkout = new Date(document.getElementById('checkout').value);
    const isMulti = document.getElementById('multi').checked;
    const holidayManual = document.getElementById('holiday_manual').checked;

    if (isNaN(checkin) || isNaN(checkout) || checkout <= checkin) {
        document.getElementById('total').innerText = "0 円";
        document.getElementById('days_display').innerText = "正しい日付を入力してください";
        document.getElementById('details').innerHTML = "";
        return;
    }

    const diffTime = Math.abs(checkout - checkin);
    const nights = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    
    if (nights > 7) {
        alert("最大7泊までです。日数を調整してください。");
        return;
    }

    const days = nights; // 制度上の利用日数は「泊数」に準ずる計算

    // 1. 京都市利用料
    let city_fee = 0;
    if (div === "A") {
        city_fee = (days <= 5) ? 9820 * days : (9820 * 5) + (12320 * (days - 5));
    } else if (div === "B") {
        city_fee = (days <= 5) ? 2430 * days : (2430 * 5) + (4930 * (days - 5));
    } else {
        city_fee = 0; // C1, C2
    }

    // 2. 施設基本料（ぶどうの木設定）
    let hotel_base = 10000 + (25000 * (days - 1));

    // 3. 曜日・祝日加算 (金・土・日・祝前・祝) 1泊あたり5,000円
    let weekend_add = 0;
    let currentDate = new Date(checkin);
    for (let i = 0; i < nights; i++) {
        let dayOfWeek = currentDate.getDay(); // 0:日, 5:金, 6:土
        if (dayOfWeek === 0 || dayOfWeek === 5 || dayOfWeek === 6 || holidayManual) {
            weekend_add += 5000;
        }
        currentDate.setDate(currentDate.getDate() + 1);
    }

    // 4. 多胎児加算
    const multi_fee = isMulti ? (2000 * days) : 0;

    const total = city_fee + hotel_base + weekend_add + multi_fee;

    document.getElementById('total').innerText = total.toLocaleString() + " 円";
    document.getElementById('days_display').innerText = nights + "泊" + (nights + 1) + "日 利用";
    document.getElementById('details').innerHTML = `
        ・京都市委託料：${city_fee.toLocaleString()}円<br>
        ・施設基本室料：${hotel_base.toLocaleString()}円<br>
        ・曜日/祝日加算：${weekend_add.toLocaleString()}円<br>
        ${isMulti ? `・多胎児加算：${multi_fee.toLocaleString()}円<br>` : ''}
    `;
}
calc();
</script>

</body>
</html>
